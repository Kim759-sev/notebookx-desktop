[package]
name = "notebookx-desktop"
version = "0.1.0"
description = "NotebookX Desktop — One-click Cloud ComfyUI Studio, Google Colab GPU Manager, Cost Guards & Local Workflow API Gateway"
authors = ["NotebookX Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "notebookx_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "multipart", "json"] }
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
toml = "0.8"
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
open = "5"

[dev-dependencies]
tempfile = "3"
